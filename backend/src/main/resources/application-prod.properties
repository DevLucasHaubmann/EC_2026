spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${SERVER_PORT}

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# CORS — comma-separated allowed origins (e.g. https://app.tukan.com).
# Required in production: the placeholder has no default, so an unset CORS_ALLOWED_ORIGINS
# fails fast at startup instead of silently falling back to a dev origin.
tukan.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

ai.provider=${IA}

# IA - Gemini
ai.gemini.api-key=${GEMINI_API_KEY}
ai.gemini.model=${GEMINI_MODEL}
ai.gemini.max-tokens=${GEMINI_MAX_TOKENS}
ai.gemini.temperature=${GEMINI_TEMPERATURE}
ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS}

# Stuck-job recovery (Task 2.3E-recovery) — see application-local.properties for rationale.
tukan.jobs.recovery.stuck-threshold-minutes=${JOB_RECOVERY_STUCK_THRESHOLD_MINUTES:10}
tukan.jobs.recovery.interval-ms=${JOB_RECOVERY_INTERVAL_MS:300000}